<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Spinner - Day 4</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="container">
    <h1 class="title">Loading Spinners</h1>
    <p class="subtitle">5 variasi loading dengan CSS murni</p>

    <div class="spinners-grid">

      <!-- 1. Circle -->
      <div class="spinner-item">
        <div class="spinner-circle"></div>
        <p>Circle</p>
      </div>

      <!-- 2. Dots -->
      <div class="spinner-item">
        <div class="spinner-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p>Dots</p>
      </div>

      <!-- 3. Pulse -->
      <div class="spinner-item">
        <div class="spinner-pulse"></div>
        <p>Pulse</p>
      </div>

      <!-- 4. Bars -->
      <div class="spinner-item">
        <div class="spinner-bars">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
        <p>Bars</p>
      </div>

      <!-- 5. Skeleton -->
      <div class="spinner-item spinner-item--wide">
        <div class="skeleton">
          <div class="skeleton-avatar"></div>
          <div class="skeleton-lines">
            <div class="skeleton-line"></div>
            <div class="skeleton-line skeleton-line--short"></div>
          </div>
        </div>
        <p>Skeleton</p>
      </div>

    </div>
  </section>

</body>
</html>
